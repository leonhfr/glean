version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - funcorder
    - gocritic
    - gocyclo
    - godot
    - godox
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - paralleltest
    - perfsprint
    - predeclared
    - revive
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usetesting
    - whitespace
  settings:
    funcorder:
      function: true
    gocyclo:
      min-complexity: 12
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
