name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Restore project linter
        id: linter-cache
        uses: actions/cache@v4
        with:
          path: bin/glean-golangci-lint
          key: linter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', 'mise.toml') }}
      - name: Mark restored linter fresh
        if: steps.linter-cache.outputs.cache-hit == 'true'
        run: touch bin/glean-golangci-lint
      - run: mise run check
